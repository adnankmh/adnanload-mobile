name: ADNANLOAD - Release APK

on:
  workflow_dispatch:
    inputs:
      split_apks:
        description: 'Also build smaller APKs for individual device CPU types'
        type: boolean
        default: false
        required: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: adnanload-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: Build Flutter release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Flutter project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reclaim non-Android disk space on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # These preinstalled SDKs are unrelated to Flutter/Java/Android builds.
          # Never remove Android SDK build-tools, platforms, NDK or Flutter.
          for path in /usr/share/dotnet /usr/local/share/powershell /usr/local/swift /opt/hostedtoolcache/CodeQL /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk/system-images; do
            if [ -e "$path" ]; then
              echo "Removing unused toolchain: $path"
              sudo rm -rf -- "$path"
            fi
          done
          echo "Disk space after cleanup:"
          df -h /

      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Flutter 3.47.8 (Dart 3.13)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: false

      - name: Verify SDK and repository layout
        shell: bash
        run: |
          flutter --version
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f tools/configure_android.py
          test -f assets/adnanload_mark.png

      - name: Generate Flutter Android project
        run: flutter create --platforms=android --org com.adnanload --project-name adnanload_mobile --no-pub .

      - name: Configure Android manifest, icons and Gradle
        run: python3 tools/configure_android.py

      - name: Verify source and Android configuration
        run: |
          python3 tools/test_version_policy.py
          python3 tools/test_android_config.py
          python3 tools/test_ci_signing.py
          python3 tools/validate_release_v2.py

      - name: Configure optional production-signing secrets
        id: signing
        env:
          ADNANLOAD_KEYSTORE_BASE64: ${{ secrets.ADNANLOAD_KEYSTORE_BASE64 }}
          ADNANLOAD_STORE_PASSWORD: ${{ secrets.ADNANLOAD_STORE_PASSWORD }}
          ADNANLOAD_KEY_PASSWORD: ${{ secrets.ADNANLOAD_KEY_PASSWORD }}
          ADNANLOAD_KEY_ALIAS: ${{ secrets.ADNANLOAD_KEY_ALIAS }}
        run: python3 tools/configure_ci_signing.py

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Flutter analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter unit tests
        run: flutter test

      - name: Report build disk capacity
        shell: bash
        run: |
          echo "Available disk before Android build:"
          df -h /
          echo "Existing build and cache footprint:"
          du -sh build "$HOME/.gradle" "$HOME/.pub-cache" 2>/dev/null || true

      - name: Build ARM64 Release APK (default, modern Android phones)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.split_apks) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-diagnostics
          flutter build apk --release --no-pub --target-platform android-arm64 2>&1 | tee build/ci-diagnostics/flutter-release-build.log

      - name: Build split Release APKs (optional, other CPU architectures)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.split_apks }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-diagnostics
          flutter build apk --release --no-pub --split-per-abi 2>&1 | tee build/ci-diagnostics/flutter-release-build.log

      - name: Validate generated APK archive and Android package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK generated in build/app/outputs/flutter-apk/"
            exit 1
          fi
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$aapt"
          mkdir -p build/ci-diagnostics
          for apk in "${apks[@]}"; do
            echo "Validating $apk"
            test -s "$apk"
            unzip -tqq "$apk"
            report="build/ci-diagnostics/$(basename "$apk").badging.txt"
            "$aapt" dump badging "$apk" > "$report"
            head -n 12 "$report"
            grep -Fq "package: name='com.adnanload.adnanload_mobile'" "$report"
            if [[ "$apk" == *app-release.apk || "$apk" == *arm64-v8a-release.apk ]]; then
              unzip -Z1 "$apk" > build/ci-diagnostics/apk-contents.txt
              grep -q '^lib/arm64-v8a/' build/ci-diagnostics/apk-contents.txt
            fi
          done
          df -h /

      - name: Write checksums and release metadata
        shell: bash
        run: |
          mkdir -p build/release-checksums
          cd build/app/outputs/flutter-apk
          sha256sum *.apk > ../../../release-checksums/SHA256SUMS.txt
          ls -lh *.apk | tee ../../../release-checksums/FILES.txt
          echo "Signing: ${{ steps.signing.outputs.mode }}" >> ../../../release-checksums/FILES.txt
          echo "Commit: ${{ github.sha }}" >> ../../../release-checksums/FILES.txt

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ADNANLOAD-v2.1.3-RELEASE-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/release-checksums/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build failure diagnostics (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ADNANLOAD-build-diagnostics
          path: |
            build/app/outputs/logs/
            build/reports/
            build/ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
